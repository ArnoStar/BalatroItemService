[project]
name = "balatro-item-service"
version = "0.1.0"
description = "Collectible Balatro items (jokers and tags with editions) linked to players' accounts: found by playing, traded between players"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.30",
]

[project.scripts]
balatro-items = "balatro_items.main:run"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["balatro_items"]
